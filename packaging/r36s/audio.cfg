// Built-in OPL plays Doom MUS/MIDI without FMOD or external instrument files.
// Apply once, then keep owner MIDI-device and volume choices on later launches.
snd_mididevice -3
set r36s_audio_profile 1
archivecvar r36s_audio_profile
echo "R36S audio profile 1 applied; built-in OPL music selected."
