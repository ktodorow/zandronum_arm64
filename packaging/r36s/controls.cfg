// Applied once per configuration; engine archives marker with bindings.
// Override only keys used by gameplay.gptk, keeping other owner bindings.
bind w +forward
bind s +back
bind a +moveleft
bind d +moveright
bind uparrow +forward
bind downarrow +back
bind leftarrow +left
bind rightarrow +right
bind enter +use
bind ctrl +attack
bind shift +speed
bind space +jump
bind c +crouch
bind home centerview
bind "[" weapprev
bind "]" weapnext
bind tab togglemap
unbind y
// Disable menu mouse selection: right-stick drift must not move selection.
m_use_mouse 0
m_showinputgrid 1
freelook 1
set r36s_controls_profile 1
archivecvar r36s_controls_profile
echo "R36S controls profile 1 applied; save-name grid enabled."
