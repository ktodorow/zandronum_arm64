// Native settings used by device validation. Apply once; retain later owner choices.
gl_dynlight_shader 1
gl_usevbo 0
gl_forcemultipass 0
vid_maxfps 0
cl_capfps 0
vid_vsync 0
set r36s_gles_profile 1
archivecvar r36s_gles_profile
echo "R36S native GLES profile 1 applied; shader lights and uncapped rendering."
